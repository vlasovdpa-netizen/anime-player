<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b0b0e; color: #f0f0f5; padding: 14px; user-select: none; }
        
        .shiki-card { display: flex; gap: 12px; background: #14141b; border: 1px solid #232330; padding: 10px; border-radius: 12px; margin-bottom: 12px; align-items: center; }
        .poster { width: 52px; height: 74px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }
        .info { flex: 1; overflow: hidden; }
        .title { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 12px; color: #9a9ab0; margin-top: 4px; }
        .badge { display: inline-block; background: #262638; color: #70a1ff; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-top: 5px; }

        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid #22222c; box-shadow: 0 8px 30px rgba(0,0,0,0.6); position: relative; }
        video, iframe { width: 100%; height: 100%; outline: none; border: none; }

        .controls-row { display: flex; gap: 8px; margin-top: 12px; }
        select, input { background: #16161d; color: #fff; border: 1px solid #2c2c3a; padding: 10px 12px; border-radius: 10px; font-size: 13px; outline: none; }
        select { width: 125px; }
        input { flex: 1; min-width: 0; }
        .search-btn { background: #5865F2; color: #fff; border: none; padding: 0 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; margin-top: 14px; max-height: 200px; overflow-y: auto; padding-right: 4px; }
        .ep-btn { background: #16161d; border: 1px solid #262633; color: #ccc; padding: 10px 0; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .ep-btn.active { background: #5865F2; color: #fff; border-color: #5865F2; }
        
        .status { color: #9a9ab0; font-size: 12px; margin-top: 12px; text-align: center; line-height: 1.4; }
        .fallback-btn { display: none; width: 100%; margin-top: 10px; background: #262638; color: #70a1ff; border: 1px solid #3a3a52; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
    </style>
</head>
<body>

    <div class="shiki-card">
        <img id="anime-poster" class="poster" src="https://shikimori.one/favicons/favicon-96x96.png" alt="poster">
        <div class="info">
            <div class="title" id="anime-title">Загрузка аниме...</div>
            <div class="meta" id="anime-meta">Подключаемся к видеосерверу...</div>
            <div class="badge" id="quality-badge">HLS 1080p • Прямой поток</div>
        </div>
    </div>

    <div class="video-box" id="player-container">
        <video id="video" controls playsinline></video>
    </div>

    <div class="controls-row">
        <input type="text" id="search-input" placeholder="Найти другое аниме...">
        <button class="search-btn" onclick="manualSearch()">Найти</button>
        <select id="quality-select">
            <option value="hls_1080">1080p FHD</option>
            <option value="hls_720">720p HD</option>
            <option value="hls_480">480p SD</option>
        </select>
    </div>

    <a id="ext-link" class="fallback-btn" target="_blank">🌐 Открыть во внешнем мульти-плеере (Все озвучки)</a>
    <div class="episodes-grid" id="episodes-list"></div>
    <div class="status" id="status-text">Ищем релиз...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const initialQuery = params.get('q') || 'Человек-бензопила';
        const initialEn = params.get('en') || '';

        const video = document.getElementById('video');
        const titleEl = document.getElementById('anime-title');
        const metaEl = document.getElementById('anime-meta');
        const posterEl = document.getElementById('anime-poster');
        const epListEl = document.getElementById('episodes-list');
        const statusEl = document.getElementById('status-text');
        const qualitySelect = document.getElementById('quality-select');
        const extLink = document.getElementById('ext-link');

        let episodesData = [];
        let currentEpIndex = 0;
        let hls = null;

        // Очищает название от двоеточий, скобок и номеров сезона для точного поиска видео
        function simplifyQuery(str) {
            return str
                .replace(/\[.*?\]|\(.*?\)/g, '')
                .replace(/[:\-—!?.]/g, ' ')
                .replace(/\b(сезон|season|part|часть|тв|tv)\s*\d*/gi, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function tryLibriaSearch(q) {
            if (!q) return [];
            try {
                const res = await fetch(`https://anilibria.top/api/v1/app/search/releases?query=${encodeURIComponent(q)}`);
                if (!res.ok) return [];
                const data = await res.json();
                return Array.isArray(data) ? data : [];
            } catch (e) {
                return [];
            }
        }

        async function loadAnime(query, enQuery = '') {
            titleEl.textContent = query;
            metaEl.textContent = "Поиск видеопотока 1080p...";
            statusEl.textContent = `Ищем «${query}» на сервере...`;
            epListEl.innerHTML = '';
            extLink.style.display = 'none';

            // 1. Независимая попытка подтянуть инфу с Шикимори (если заблокировано — не ломает плеер!)
            fetch(`https://shikimori.one/api/animes?search=${encodeURIComponent(query)}&limit=1`)
                .then(r => r.ok ? r.json() : null)
                .then(list => {
                    if (list && list.length > 0) {
                        const s = list[0];
                        titleEl.textContent = s.russian || s.name || query;
                        metaEl.textContent = `⭐ Шики: ${s.score || '8+'} • Серий: ${s.episodes || s.episodes_aired || '?'}`;
                        if (s.image && s.image.preview) {
                            posterEl.src = `https://shikimori.one${s.image.preview}`;
                        }
                    }
                })
                .catch(() => {}); // Игнорируем ошибку CORS Шикимори, чтобы видео грузилось дальше

            // 2. Умный многоступенчатый поиск видеопотока
            let libList = await tryLibriaSearch(query);

            if (libList.length === 0) {
                const cleanQ = simplifyQuery(query);
                if (cleanQ && cleanQ !== query) {
                    libList = await tryLibriaSearch(cleanQ);
                }
            }
            if (libList.length === 0 && enQuery) {
                libList = await tryLibriaSearch(simplifyQuery(enQuery));
            }
            if (libList.length === 0) {
                // Пробуем по первым двум главным словам названия
                const shortWords = simplifyQuery(query).split(' ').slice(0, 2).join(' ');
                if (shortWords.length > 3) {
                    libList = await tryLibriaSearch(shortWords);
                }
            }

            // Показываем кнопку резервного мульти-плеера на случай, если нужна другая озвучка
            extLink.href = `https://animego.org/search/all?q=${encodeURIComponent(query)}`;
            extLink.style.display = 'block';

            if (!libList || libList.length === 0) {
                statusEl.textContent = "Этой анимешки нет в прямой базе HLS. Нажми синюю кнопку выше или вбей другой тайтл в поиск!";
                return;
            }

            try {
                const release = libList[0];
                const releaseId = release.id;

                // Если Шикимори не дала постер — берем красивый постер напрямую из видео-базы
                if (release.poster && release.poster.url) {
                    posterEl.src = `https://anilibria.top${release.poster.url}`;
                }
                if (release.name && release.name.main) {
                    titleEl.textContent = release.name.main;
                }

                const fullRes
