<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Player Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0c0d14; color: #f3f4f6; padding: 12px; user-select: none; }
        
        .card { display: flex; gap: 10px; background: #151824; border: 1px solid #23283b; padding: 10px; border-radius: 12px; margin-bottom: 10px; align-items: center; }
        .poster { width: 48px; height: 68px; border-radius: 8px; object-fit: cover; background: #1c2030; flex-shrink: 0; }
        .info { flex: 1; overflow: hidden; }
        .title { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 11px; color: #94a3b8; margin-top: 3px; }
        .badge { display: inline-block; background: #22293f; color: #38bdf8; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; margin-top: 4px; }
        .vip-badge { background: #f59e0b; color: #000; font-weight: 700; }

        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #24293d; }
        video { width: 100%; height: 100%; outline: none; }

        .fs-btn { position: absolute; top: 8px; right: 8px; z-index: 20; background: rgba(15, 23, 42, 0.75); border: 1px solid #334155; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(4px); }
        .fs-btn:hover { background: rgba(56, 189, 248, 0.85); color: #000; }

        .paywall-overlay { display: none; position: absolute; inset: 0; background: rgba(12, 13, 20, 0.95); z-index: 30; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
        .paywall-overlay h3 { font-size: 17px; margin-bottom: 6px; color: #f59e0b; }
        .paywall-overlay p { font-size: 12px; color: #cbd5e1; margin-bottom: 14px; max-width: 260px; line-height: 1.4; }
        .buy-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; font-weight: 700; padding: 10px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; }

        .controls { display: flex; gap: 8px; margin-top: 10px; }
        input, select { background: #151824; color: #fff; border: 1px solid #23283b; padding: 8px 10px; border-radius: 8px; font-size: 12px; outline: none; }
        input { flex: 1; }
        select { width: 110px; }
        .search-btn { background: #38bdf8; color: #000; border: none; padding: 0 14px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }

        .episodes-title { font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: #94a3b8; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; max-height: 170px; overflow-y: auto; }
        .ep-item { background: #151824; border: 1px solid #23283b; color: #cbd5e1; padding: 8px 0; border-radius: 8px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; position: relative; }
        .ep-item.active { background: #38bdf8; color: #000; border-color: #38bdf8; }
        .ep-item.locked { color: #64748b; background: #0f111a; border-style: dashed; }
        .status { text-align: center; font-size: 11px; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <img id="poster" class="poster" src="https://anilibria.top/favicon.ico" alt="poster">
        <div class="info">
            <div class="title" id="title">Загрузка тайтла...</div>
            <div class="meta" id="meta">Подключение к серверам...</div>
            <div class="badge" id="vip-status">Бесплатный режим</div>
        </div>
    </div>

    <div class="video-wrapper" id="video-box">
        <button class="fs-btn" onclick="toggleFullscreen()">⛶ Экран</button>
        <video id="video" controls playsinline></video>
        
        <div class="paywall-overlay" id="paywall">
            <h3>🔒 Серия доступна по VIP</h3>
            <p>Первые 2 серии открыты для всех. Оформи VIP-подписку в боте, чтобы смотреть все сезоны в 1080p!</p>
            <button class="buy-btn" onclick="openVipPurchase()">Купить VIP за Telegram Stars</button>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="query" placeholder="Найти другое аниме...">
        <button class="search-btn" onclick="searchNew()">Найти</button>
        <select id="quality" onchange="switchQuality()">
            <option value="1080">1080p FHD</option>
            <option value="720">720p HD</option>
            <option value="480">480p SD</option>
        </select>
    </div>

    <div class="episodes-title">Серии:</div>
    <div class="ep-grid" id="episodes"></div>
    <div class="status" id="status">Инициализация...</div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('q') || 'Человек-бензопила';
        const isVipUser = urlParams.get('vip') === '1';

        const videoBox = document.getElementById('video-box');
        const video = document.getElementById('video');
        const paywall = document.getElementById('paywall');
        const statusEl = document.getElementById('status');
        const posterEl = document.getElementById('poster');
        const titleEl = document.getElementById('title');
        const metaEl = document.getElementById('meta');
        const vipStatusEl = document.getElementById('vip-status');

        if (isVipUser) {
            vipStatusEl.textContent = "⭐ VIP Доступ Активен";
            vipStatusEl.classList.add("vip-badge");
        }

        let episodes = [];
        let currentIndex = 0;
        let hls = null;

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (videoBox.requestFullscreen) {
                    videoBox.requestFullscreen();
                } else if (videoBox.webkitRequestFullscreen) {
                    videoBox.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function openVipPurchase() {
            if (tg) {
                tg.sendData(JSON.stringify({ action: "buy_vip" }));
                tg.close();
            } else {
                alert("Для покупки перейдите в Telegram-бота!");
            }
        }

        async function fetchRelease(q) {
            statusEl.textContent = `Поиск «${q}» в anilibria.top...`;
            try {
                const res = await fetch(`https://anilibria.top/api/v1/app/search/releases?query=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) return null;

                const full = await fetch(`https://anilibria.top/api/v1/anime/releases/${data[0].id}`);
                return await full.json();
            } catch (err) {
                return null;
            }
        }

        async function loadAnime(q) {
            paywall.style.display = 'none';
            const release = await fetchRelease(q);
            if (!release || !release.episodes || release.episodes.length === 0) {
                statusEl.textContent = "Аниме не найдено на anilibria.top. Попробуйте другой запрос.";
                return;
            }

            titleEl.textContent = release.name?.main || q;
            metaEl.textContent = `Серий: ${release.episodes.length} • anilibria.top`;
            if (release.poster?.src) {
                posterEl.src = `https://anilibria.top${release.poster.src}`;
            }

            episodes = release.episodes;
            renderEpisodes();
            selectEpisode(0);
        }

        function renderEpisodes() {
            const container = document.getElementById('episodes');
            container.innerHTML = '';

            episodes.forEach((ep, i) => {
                const isLocked = !isVipUser && i >= 2;
                const btn = document.createElement('div');
                btn.className = `ep-item ${isLocked ? 'locked' : ''} ${i === currentIndex ? 'active' : ''}`;
                btn.innerHTML = `${ep.ordinal || (i + 1)} ${isLocked ? '🔒' : ''}`;
                btn.onclick = () => selectEpisode(i);
                container.appendChild(btn);
            });
        }

        function selectEpisode(i) {
            currentIndex = i;
            renderEpisodes();

            if (!isVipUser && i >= 2) {
                if (hls) hls.destroy();
                video.pause();
                video.src = "";
                paywall.style.display = 'flex';
                statusEl.textContent = "Оформите подписку для просмотра следующих серий.";
                return;
            }

            paywall.style.display = 'none';
            const ep = episodes[i];
            const q = document.getElementById('quality').value;
            const stream = (q === '1080' ? ep.hls_1080 : q === '720' ? ep.hls_720 : ep.hls_480) 
                         || ep.hls_1080 || ep.hls_720 || ep.hls_480;

            if (!stream) {
                statusEl.textContent = "Поток недоступен.";
                return;
            }

            statusEl.textContent = `Воспроизведение: Серия ${ep.ordinal || (i + 1)}`;
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(stream);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = stream;
                video.play().catch(() => {});
            }
        }

        function switchQuality() {
            if (episodes.length > 0) selectEpisode(currentIndex);
        }

        function searchNew() {
            const val = document.getElementById('query').value.trim();
            if (val) loadAnime(val);
        }

        loadAnime(searchQuery);
    </script>
</body>
</html>
